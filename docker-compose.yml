services:
  web:
    build: .
    container_name: uit_web_php
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./quanlynhansu:/var/www/html/quanlynhansu
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: uit_web_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qlsp
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: uit_web_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  mysql_data:
